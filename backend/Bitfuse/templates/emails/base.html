<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bitfuse Notification{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f6f9; padding: 20px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e1e8ed; overflow: hidden; text-align: left;">
                    <tr>
                        <td style="background-color: #0052FF; padding: 24px 30px; text-align: left;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;">Bitfuse</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 30px; color: #1e293b; font-size: 15px; line-height: 1.6;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #f8fafc; padding: 20px 30px; border-top: 1px solid #e2e8f0; font-size: 13px; color: #64748b; line-height: 1.5;">
                            <p style="margin: 0 0 8px 0;">Need help? Contact support at <a href="mailto:support@bitfuse.mw" style="color: #0052FF; text-decoration: none;">support@bitfuse.mw</a>.</p>
                            <p style="margin: 0;">Bitfuse Fintech. This is an automated transactional notification regarding your account.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
